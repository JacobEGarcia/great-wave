<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE GREAT WAVE</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#e8d4a8;color:#29221a;font:13px ui-monospace,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;padding:22px;pointer-events:none}.title{font:900 clamp(28px,6vw,65px)/.8 serif;letter-spacing:-.05em}.title span{color:#1c5373}.sub{margin-top:12px;letter-spacing:.13em}.score{position:absolute;right:22px;top:22px;text-align:right}.score b{font-size:28px;color:#b33b2f}.meter{position:absolute;left:22px;bottom:22px;width:260px}.bar{height:9px;border:2px solid #29221a;background:#eadbb8}.bar i{display:block;height:100%;background:#b33b2f;width:0}.help{position:absolute;right:22px;bottom:22px;text-align:right}.start{position:fixed;inset:0;background:#ead9bddd;display:grid;place-items:center;text-align:center;z-index:3}.start.off{display:none}.start button{font:inherit;font-weight:bold;border:3px solid #173f59;background:#e9d4a8;color:#173f59;padding:14px 25px;cursor:pointer}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="title">THE <span>GREAT WAVE</span></div><div class="sub">A WOODBLOCK SURFING STUDY</div><div class="score">DISTANCE <b id="dist">0000</b> m<br>TRICKS <b id="score">00000</b></div><div class="meter">FLOW<div class="bar"><i id="flow"></i></div></div><div class="help">← → CARVE · SPACE JUMP · X SPIN<br><b id="msg">FOLLOW THE CREST</b></div></div><div class="start" id="start"><div><div class="title">THE <span>GREAT WAVE</span></div><p>Ride the moving woodblock. Carve for flow. Jump at the crest.</p><button id="go">PADDLE OUT</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let p={x:innerWidth*.32,y:0,vy:0,a:0,flow:0},keys={},running=false,dist=0,score=0,last=0;const $=s=>document.querySelector(s);function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();onkeydown=e=>{keys[e.key]=1;if(e.code==='Space'&&Math.abs(p.vy)<1){p.vy=-12;score+=100;$('#msg').textContent='AIRBORNE +100'}if(e.key.toLowerCase()==='x'&&p.vy<0){p.a+=6.28;score+=250;$('#msg').textContent='WOODBLOCK SPIN +250'}};onkeyup=e=>keys[e.key]=0;$('#go').onclick=()=>{$('#start').classList.add('off');running=true};function waveY(x,t){return innerHeight*.62+Math.sin(x*.009+t*.0018)*42+Math.sin(x*.021-t*.001)*15}function draw(t){let w=innerWidth,h=innerHeight,dt=Math.min(32,t-last);last=t;g.fillStyle='#e8d4a8';g.fillRect(0,0,w,h);g.globalAlpha=.12;for(let i=0;i<1000;i++){let xx=(i*73)%w,yy=(i*151)%h;g.fillStyle=i%2?'#765b37':'#fff';g.fillRect(xx,yy,1,1)}g.globalAlpha=1;let sunx=w*.72,suny=h*.25;g.fillStyle='#c34a35';g.beginPath();g.arc(sunx,suny,45,0,7);g.fill();g.fillStyle='#d9c08e';g.strokeStyle='#273d50';g.lineWidth=4;g.beginPath();g.moveTo(w*.68,h*.48);g.lineTo(w*.76,h*.31);g.lineTo(w*.84,h*.48);g.closePath();g.fill();g.stroke();g.fillStyle='#f1e5c6';g.beginPath();g.moveTo(w*.735,h*.365);g.lineTo(w*.76,h*.31);g.lineTo(w*.785,h*.365);g.closePath();g.fill();let phase=t;g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=7)g.lineTo(x,waveY(x,phase));g.lineTo(w,h);g.closePath();g.fillStyle='#1e5d7e';g.fill();g.strokeStyle='#153f5a';g.lineWidth=5;g.stroke();for(let j=0;j<4;j++){g.beginPath();for(let x=0;x<=w;x+=8){let y=waveY(x,t)+j*25+Math.sin(x*.03+j)*5;x?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle=j?'#87b7bb':'#f0e4c8';g.lineWidth=j?3:11;g.stroke()}let crest=w*.62+Math.sin(t*.0007)*w*.18;g.strokeStyle='#f5ead0';g.lineWidth=14;g.beginPath();g.arc(crest,waveY(crest,t)+35,90,3.4,6.1);g.stroke();if(running){dist+=dt*.012;p.x+=(keys.ArrowRight?2.5:0)-(keys.ArrowLeft?2.5:0);let ground=waveY(p.x,t)-18;p.vy+=.58;p.y+=p.vy;if(p.y>ground){p.y=ground;p.vy=0;p.flow=Math.min(100,p.flow+.08*(keys.ArrowRight?2:1))}else p.flow=Math.max(0,p.flow-.08);$('#dist').textContent=String(Math.floor(dist)).padStart(4,'0');$('#score').textContent=String(score).padStart(5,'0');$('#flow').style.width=p.flow+'%'}else p.y=waveY(p.x,t)-18;g.save();g.translate(p.x,p.y);g.rotate(p.a+Math.atan(Math.cos(p.x*.009+t*.0018)*.38));g.strokeStyle='#251f18';g.lineWidth=4;g.beginPath();g.moveTo(-18,9);g.lineTo(20,9);g.stroke();g.fillStyle='#b43c30';g.beginPath();g.arc(0,-8,7,0,7);g.fill();g.strokeStyle='#241f19';g.lineWidth=4;g.beginPath();g.moveTo(0,-1);g.lineTo(-7,7);g.moveTo(0,-1);g.lineTo(8,7);g.stroke();g.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
